version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftops-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftops}
      POSTGRES_USER: ${POSTGRES_USER:-shiftops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftops_secure_pwd}
    volumes:
      - shiftops_prod_pgdata:/var/lib/postgresql/data
    networks:
      - shiftops_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shiftops-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shiftops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shiftops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shiftops_secure_pwd}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      OUTBOX_SCHEDULER_ENABLED: "true"
      OUTBOX_FIXED_DELAY_MS: "3000"
    volumes:
      - shiftops_prod_uploads:/app/uploads
    networks:
      - shiftops_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shiftops-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    networks:
      - shiftops_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  shiftops_prod_pgdata:
    driver: local
  shiftops_prod_uploads:
    driver: local

networks:
  shiftops_network:
    driver: bridge
