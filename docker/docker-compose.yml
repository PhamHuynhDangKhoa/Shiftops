services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiftops
      POSTGRES_USER: shiftops
      POSTGRES_PASSWORD: shiftops_dev
    ports:
      - "5433:5432"
    volumes:
      - shiftops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftops"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: shiftops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shiftops_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shiftops_pgdata:
    driver: local
  shiftops_miniodata:
    driver: local
